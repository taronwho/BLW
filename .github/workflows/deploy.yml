name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Rozdělaný deploy nerušíme, ať se nenasadí půlka buildu.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Deploy nikdy neproběhne, když validace selže (CLAUDE.md, Nasazení).
      - run: npm run validate
      - run: npm audit --omit=dev --audit-level=high
      # Firebase web-konfigurace se zapéká do buildu, aby nikdo nic nevyplňoval.
      # Není to tajemství — v prohlížeči je stejně vidět; bezpečnost dělají
      # firestore.rules. Repository variables mají přednost, secrets fungují taky.
      - name: Kontrola konfigurace Firebase
        env:
          PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$PROJECT_ID" ]; then
            echo "::warning::Firebase není nastavený — aplikace pojede jen v lokálním režimu bez sdílení."
          else
            echo "Firebase projekt: $PROJECT_ID"
          fi
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          # App Check (docs/FIREBASE.md). Bez tohohle řádku se klíč do buildu
          # nedostal, i když ho rodič v nastavení repozitáře vyplnil — a kdo
          # pak v konzoli zapnul vynucení, zablokoval sdílení všem.
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY || secrets.VITE_RECAPTCHA_SITE_KEY }}
      - name: Kontrola App Checku
        env:
          KLIC: ${{ vars.VITE_RECAPTCHA_SITE_KEY || secrets.VITE_RECAPTCHA_SITE_KEY }}
        run: |
          if [ -z "$KLIC" ]; then
            echo "::warning::VITE_RECAPTCHA_SITE_KEY není nastavený — App Check je vypnutý. V konzoli Firebase proto NEZAPÍNEJ vynucení (Enforce), jinak přestane fungovat sdílení."
          else
            echo "App Check: klíč je v buildu."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Nasazení
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
